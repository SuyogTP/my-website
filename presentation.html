<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mero Coding Competition Teleprompter</title>
  
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <style>
    :root {
      --bg: #000000;
      --card: #111827;
      --accent: #3b82f6;
      --highlight: #f59e0b;
      --text: #ffffff;
      --success: #10b981;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    .header {
      padding: 15px 30px;
      background: #111827;
      border-bottom: 1px solid #1f2937;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .header h1 {
      margin: 0;
      font-size: 1.5rem;
      color: var(--accent);
    }

    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px;
      position: relative;
    }

    .script-container {
      max-width: 1000px;
      width: 100%;
      text-align: center;
    }

    .slide-title {
      font-size: 2rem;
      color: var(--highlight);
      margin-bottom: 20px;
      font-weight: bold;
      text-transform: uppercase;
    }

    .slide-script {
      font-size: 3rem;
      line-height: 1.4;
      font-weight: 600;
    }

    .controls-bar {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(17, 24, 39, 0.95);
      padding: 15px 25px;
      border-radius: 100px;
      display: flex;
      gap: 15px;
      border: 1px solid #374151;
      z-index: 20;
    }

    button {
      background: #374151;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
    }

    button.primary { background: var(--accent); }

    .camera-container {
      position: absolute;
      bottom: 30px;
      right: 30px;
      width: 240px;
      height: 180px;
      background: #111827;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid #374151;
      z-index: 30;
      transition: height 0.2s ease-in-out;
    }

    .camera-header {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 28px;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 8px;
      z-index: 5;
    }

    .cam-btn {
      background: #374151;
      color: white;
      border: none;
      width: 20px;
      height: 20px;
      border-radius: 3px;
      cursor: pointer;
    }

    .input_video, .output_canvas {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      transform: scaleX(-1);
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>Innovators Team | Teleprompter</h1>
    <div style="font-size:1.2rem; font-weight:bold;">Slide <span id="slideIndicator">1/6</span></div>
  </div>

  <div class="main-content">
    <div class="script-container">
      <div class="slide-title" id="slideTitle">Opening Hook</div>
      <div class="slide-script" id="slideScript">Loading presentation...</div>
    </div>
  </div>

  <div class="camera-container" id="cameraBox">
    <div class="camera-header">
      <span style="font-size:0.7rem;">📷 Camera</span>
      <div>
        <button class="cam-btn" id="minCamBtn">_</button>
      </div>
    </div>
    <video class="input_video" autoplay playsinline muted></video>
    <canvas class="output_canvas" width="320" height="240"></canvas>
  </div>

  <div class="controls-bar">
    <button id="prevBtn">👈 Prev</button>
    <button id="nextBtn" class="primary">Next 👉</button>
  </div>

<script>
  const slides = [
    { 
      title: "Opening Hook", 
      text: "📢 @SUYOG: Good afternoon, judges! We are Team Innovators—Suyog, Karisha, Sohan, and Samir. Today, we are presenting an Automated Early Flood Detection and Active Mitigation System!" 
    },
    { 
      title: "The Core Problem", 
      text: "⚡ @KARISHA: When a flash flood hits, human observation is simply too slow. By the time someone notices rising water and alerts the neighborhood, it’s too late. We replace manual checks with automated code." 
    },
    { 
      title: "System Logic & Code", 
      text: "💻 @SUYOG: Our logic runs on an Arduino loop: Sensor reads depth → Code checks against threshold in milliseconds → System fires alarm and servo motor driver instantly!" 
    },
    { 
      title: "Hardware Architecture", 
      text: "🛠️ @SOHAN: Our system layout: The Eyes (water depth sensor), The Brain (Arduino microcontroller), The Infrastructure (power breadboard), and The Muscle (buzzer & servo gate)." 
    },
    { 
      title: "Live Demonstration", 
      text: "🌊 @SAMIR: [Dips sensor in water] 1. Sensor detects rise. 2. Code evaluates threshold. 3. System triggers siren! [Buzzer] 4. Barrier deploys automatically! [Servo moves 90°]" 
    },
    { 
      title: "Closing & Impact", 
      text: "🏆 @KARISHA: From detection to physical defense in milliseconds—zero human delay! Thank you judges, we are now open to your questions." 
    }
  ];

  let currentIndex = 0;
  const slideTitle = document.getElementById('slideTitle');
  const slideScript = document.getElementById('slideScript');
  const slideIndicator = document.getElementById('slideIndicator');

  function updateSlide() {
    slideTitle.textContent = slides[currentIndex].title;
    slideScript.textContent = slides[currentIndex].text;
    slideIndicator.textContent = `${currentIndex + 1}/${slides.length}`;
  }

  function nextSlide() {
    if (currentIndex < slides.length - 1) {
      currentIndex++;
      updateSlide();
    }
  }

  function prevSlide() {
    if (currentIndex > 0) {
      currentIndex--;
      updateSlide();
    }
  }

  document.getElementById('nextBtn').addEventListener('click', nextSlide);
  document.getElementById('prevBtn').addEventListener('click', prevSlide);
  
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight') nextSlide();
    if (e.key === 'ArrowLeft') prevSlide();
  });

  updateSlide();

  // Minimize Camera Logic
  let isMin = false;
  document.getElementById('minCamBtn').addEventListener('click', () => {
    const box = document.getElementById('cameraBox');
    isMin = !isMin;
    box.style.height = isMin ? '28px' : '180px';
  });

  // MediaPipe Hands Initialization
  let lastGestureTime = 0;
  const GESTURE_COOLDOWN = 1000; // 1 second delay between slide triggers

  try {
    const videoElement = document.getElementsByClassName('input_video')[0];
    const canvasElement = document.getElementsByClassName('output_canvas')[0];
    const canvasCtx = canvasElement.getContext('2d');

    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    hands.onResults((results) => {
      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
      canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        for (const landmarks of results.multiHandLandmarks) {
          drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, {color: '#3b82f6', lineWidth: 2});
          drawLandmarks(canvasCtx, landmarks, {color: '#f59e0b', lineWidth: 1, radius: 2});

          // Basic Gesture Detection: Index Finger pointing horizontally
          const now = Date.now();
          if (now - lastGestureTime > GESTURE_COOLDOWN) {
            const indexTip = landmarks[8];
            const wrist = landmarks[0];

            // Pointing left/right detection based on horizontal distance
            if (indexTip.x < wrist.x - 0.25) {
              nextSlide(); // Flipped due to scaleX(-1) mirror view
              lastGestureTime = now;
            } else if (indexTip.x > wrist.x + 0.25) {
              prevSlide();
              lastGestureTime = now;
            }
          }
        }
      }
      canvasCtx.restore();
    });

    const camera = new Camera(videoElement, {
      onFrame: async () => {
        await hands.send({image: videoElement});
      },
      width: 320,
      height: 240
    });

    camera.start();
  } catch (err) {
    console.error("Camera or MediaPipe initialization failed: ", err);
  }
</script>
</body>
</html>
