<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Innovators Team - Presentation Teleprompter</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --highlight: #f59e0b;
      --border: #334155;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }

    .container {
      background-color: var(--card);
      width: 100%;
      max-width: 850px;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }

    .header {
      border-bottom: 1px solid var(--border);
      padding-bottom: 15px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    h1 {
      margin: 0 0 5px 0;
      color: var(--accent);
      font-size: 1.6rem;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin: 0;
    }

    .slide-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 10px;
      margin-bottom: 20px;
    }

    .tab-btn {
      background: #0f172a;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
      font-size: 0.85rem;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: var(--accent);
      color: #0f172a;
      border-color: var(--accent);
      font-weight: bold;
    }

    .slide-display {
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 25px;
      min-height: 180px;
      margin-bottom: 20px;
      position: relative;
    }

    .slide-title {
      font-size: 1.2rem;
      color: var(--highlight);
      margin: 0 0 12px 0;
      font-weight: 600;
    }

    .slide-script {
      font-size: 1.15rem;
      line-height: 1.7;
      color: var(--text);
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-bottom: 20px;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    label {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    select, input[type="range"] {
      width: 100%;
      padding: 8px;
      background: #0f172a;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      box-sizing: border-box;
    }

    .btn-group {
      display: flex;
      gap: 10px;
    }

    button.nav-btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-primary {
      background-color: var(--accent);
      color: #0f172a;
    }

    .btn-primary:hover {
      background-color: var(--accent-hover);
    }

    .btn-secondary {
      background-color: #334155;
      color: var(--text);
    }

    .btn-secondary:hover {
      background-color: #475569;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <div>
      <h1>Innovators Team Teleprompter</h1>
      <p class="subtitle">Class 9 | Golden Flower Secondary School</p>
    </div>
  </div>

  <div class="slide-tabs" id="slideTabs"></div>

  <div class="slide-display">
    <div class="slide-title" id="slideTitle">Introduction</div>
    <div class="slide-script" id="slideScript">Loading script...</div>
  </div>

  <div class="controls">
    <div class="control-group">
      <label for="voiceSelect">Voice</label>
      <select id="voiceSelect"><option>Loading voices...</option></select>
    </div>
    <div class="control-group">
      <label for="rate">Speaking Speed (<span id="rateValue">1.0</span>x)</label>
      <input type="range" id="rate" min="0.5" max="1.5" value="1" step="0.1">
    </div>
  </div>

  <div class="btn-group">
    <button class="nav-btn btn-secondary" id="prevBtn">← Previous Slide</button>
    <button class="nav-btn btn-primary" id="playBtn">▶ Read Current Slide</button>
    <button class="nav-btn btn-secondary" id="pauseBtn">⏸ Pause</button>
    <button class="nav-btn btn-secondary" id="nextBtn">Next Slide →</button>
  </div>
</div>

<script>
  const slides = [
    {
      label: "Intro",
      title: "Introduction",
      text: "Hello everyone, we are the Innovators Team from Class 9 of Golden Flower Secondary School. Today, we are here to present to you about a robot that can save lives."
    },
    {
      label: "Slide 1",
      title: "Slide 1: Title & Problem Introduction",
      text: "Traditional water monitoring relies on slow, manual observation. This critical delay in alerting leads to severe structural damage and extreme safety hazards. We need a system that detects danger and acts instantly. Flash floods strike communities rapidly, often leaving residents with no time for evacuation or asset protection."
    },
    {
      label: "Slide 2",
      title: "Slide 2: System Solution Overview",
      text: "Our project acts as an automated digital watchman. By placing sensors in flood-prone zones, the system monitors water levels in real-time, 24/7. The moment water breaches the safety threshold, the system triggers a high-decibel acoustic alarm to alert the local community immediately."
    },
    {
      label: "Slide 3",
      title: "Slide 3: Mechanical & Infrastructure Defense",
      text: "Warning alone is not enough. Our system interfaces directly with mechanical barriers to physically block rising waters. Simultaneous to the alarm, the microcontroller dictates a motorized gate to deploy, demonstrating how smart cities can automatically protect infrastructure."
    },
    {
      label: "Slide 4",
      title: "Slide 4: Seamless Module Communication",
      text: "All requested components work together in a closed-loop system: The Water Level Sensor provides analog input. The Breadboard distributes 5V power and ground to all parts. The Arduino Uno processes the data. The Buzzer and Servo Motor receive digital output commands to actuate the defense mechanism."
    },
    {
      label: "Slide 5",
      title: "Slide 5: Operational Flow",
      text: "The operational flow consists of four automated steps: Detect: Water level sensor traces make contact with rising flood waters. Analyze: Arduino continuously reads analog values to check if safety limits are breached. Alert: System triggers digital pin to sound the high-decibel buzzer siren. Actuate: Servo motor receives PWM signal and deploys the physical flood gate."
    },
    {
      label: "Slide 6",
      title: "Slide 6: Impact & Real-World Context",
      text: "To understand the gravity of these events, consider that 600 people are confirmed dead, with 3,000 missing across the region. By combining basic microelectronics with smart programming logic, we can build scalable, automated infrastructure that saves both property and lives."
    },
    {
      label: "Slide 7",
      title: "Slide 7: Conclusion",
      text: "Thank you. This concludes our presentation by the Innovators Team."
    }
  ];

  let currentIndex = 0;
  const synth = window.speechSynthesis;
  let voices = [];

  const tabsContainer = document.getElementById('slideTabs');
  const slideTitle = document.getElementById('slideTitle');
  const slideScript = document.getElementById('slideScript');
  const voiceSelect = document.getElementById('voiceSelect');
  const rate = document.getElementById('rate');
  const rateValue = document.getElementById('rateValue');

  const playBtn = document.getElementById('playBtn');
  const pauseBtn = document.getElementById('pauseBtn');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');

  // Render Tabs
  slides.forEach((slide, idx) => {
    const btn = document.createElement('button');
    btn.className = `tab-btn ${idx === 0 ? 'active' : ''}`;
    btn.textContent = slide.label;
    btn.addEventListener('click', () => jumpToSlide(idx));
    tabsContainer.appendChild(btn);
  });

  function updateDisplay() {
    synth.cancel();
    slideTitle.textContent = slides[currentIndex].title;
    slideScript.textContent = slides[currentIndex].text;

    const tabs = tabsContainer.querySelectorAll('.tab-btn');
    tabs.forEach((tab, idx) => {
      tab.classList.toggle('active', idx === currentIndex);
    });

    prevBtn.disabled = currentIndex === 0;
    nextBtn.disabled = currentIndex === slides.length - 1;
  }

  function jumpToSlide(index) {
    currentIndex = index;
    updateDisplay();
  }

  function loadVoices() {
    voices = synth.getVoices();
    voiceSelect.innerHTML = '';
    voices.forEach((voice, index) => {
      const option = document.createElement('option');
      option.textContent = `${voice.name} (${voice.lang})`;
      option.value = index;
      if (voice.default || voice.lang.includes('en')) option.selected = true;
      voiceSelect.appendChild(option);
    });
  }

  if (speechSynthesis.onvoiceschanged !== undefined) {
    speechSynthesis.onvoiceschanged = loadVoices;
  }
  loadVoices();

  rate.addEventListener('input', () => {
    rateValue.textContent = rate.value;
  });

  function speakCurrentSlide() {
    if (synth.paused) {
      synth.resume();
      return;
    }
    synth.cancel();
    const utterance = new SpeechSynthesisUtterance(slides[currentIndex].text);
    if (voices[voiceSelect.value]) {
      utterance.voice = voices[voiceSelect.value];
    }
    utterance.rate = parseFloat(rate.value);
    synth.speak(utterance);
  }

  playBtn.addEventListener('click', speakCurrentSlide);

  pauseBtn.addEventListener('click', () => {
    if (synth.speaking && !synth.paused) synth.pause();
  });

  prevBtn.addEventListener('click', () => {
    if (currentIndex > 0) {
      currentIndex--;
      updateDisplay();
    }
  });

  nextBtn.addEventListener('click', () => {
    if (currentIndex < slides.length - 1) {
      currentIndex++;
      updateDisplay();
    }
  });

  // Keyboard Navigation (Left/Right Arrows)
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight' && currentIndex < slides.length - 1) {
      currentIndex++;
      updateDisplay();
    } else if (e.key === 'ArrowLeft' && currentIndex > 0) {
      currentIndex--;
      updateDisplay();
    } else if (e.key === ' ') {
      e.preventDefault();
      speakCurrentSlide();
    }
  });

  updateDisplay();
</script>

</body>
</html>
