<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gesture Teleprompter - Hikvision Board Ready</title>
  
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <style>
    :root {
      --bg: #000000;
      --card: #111827;
      --accent: #3b82f6;
      --highlight: #f59e0b;
      --text: #ffffff;
      --text-muted: #9ca3af;
      --success: #10b981;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      touch-action: manipulation;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }

    .header {
      padding: 15px 30px;
      background: #111827;
      border-bottom: 1px solid #1f2937;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .header h1 {
      margin: 0;
      font-size: clamp(1.2rem, 2vw, 2rem);
      color: var(--accent);
    }

    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 40px;
      position: relative;
    }

    .script-container {
      max-width: 1200px;
      width: 100%;
      text-align: center;
    }

    .slide-title {
      font-size: clamp(1.5rem, 3vw, 2.5rem);
      color: var(--highlight);
      margin-bottom: 20px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .slide-script {
      font-size: clamp(2rem, 4vw, 4rem);
      line-height: 1.3;
      font-weight: 600;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
    }

    .controls-bar {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(17, 24, 39, 0.95);
      backdrop-filter: blur(10px);
      padding: 12px 20px;
      border-radius: 100px;
      display: flex;
      gap: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      border: 1px solid #374151;
      z-index: 20;
      flex-wrap: wrap;
      justify-content: center;
    }

    button {
      background: #374151;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: clamp(0.9rem, 1.2vw, 1.2rem);
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover { background: #4b5563; }
    button:active { transform: scale(0.95); }
    button.primary { background: var(--accent); }
    button.primary:hover { background: #2563eb; }
    
    button.gesture-on { background: var(--success); color: white; }
    button.gesture-off { background: var(--danger); color: white; }

    /* --- Draggable & Resizable Camera Styles --- */
    .camera-container {
      position: absolute;
      bottom: 30px;
      right: 30px;
      width: 280px;
      height: 210px;
      background: #111827;
      border-radius: 12px;
      overflow: hidden;
      border: 3px solid #374151;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      z-index: 30;
      cursor: grab;
      touch-action: none;
    }

    .camera-header {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 32px;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 8px;
      z-index: 5;
    }

    .cam-title {
      font-size: 0.75rem;
      font-weight: bold;
      color: #fff;
    }

    .cam-controls {
      display: flex;
      gap: 4px;
    }

    .cam-btn {
      background: #374151;
      color: white;
      border: none;
      width: 22px;
      height: 22px;
      font-size: 0.8rem;
      border-radius: 4px;
      padding: 0;
      line-height: 22px;
      text-align: center;
      cursor: pointer;
    }

    .camera-container.tracking {
      border-color: #10b981;
      box-shadow: 0 0 25px rgba(16, 185, 129, 0.5);
    }

    .input_video, .output_canvas {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      transform: scaleX(-1);
    }

    .cam-status {
      position: absolute;
      bottom: 6px;
      left: 0;
      width: 100%;
      text-align: center;
      font-size: 0.75rem;
      color: #10b981;
      font-weight: bold;
      z-index: 2;
      text-shadow: 1px 1px 2px black;
    }

    .toast {
      position: absolute;
      top: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(16, 185, 129, 0.95);
      color: white;
      padding: 12px 28px;
      font-size: 1.4rem;
      font-weight: bold;
      border-radius: 50px;
      opacity: 0;
      transition: opacity 0.3s;
      z-index: 50;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>Innovators Team | Hikvision Teleprompter</h1>
    <div style="font-size:1.2rem; font-weight:bold;">Slide <span id="slideIndicator">1/6</span></div>
  </div>

  <div id="toast" class="toast">👉 Next Slide</div>

  <div class="main-content">
    <div class="script-container">
      <div class="slide-title" id="slideTitle">Loading...</div>
      <div class="slide-script" id="slideScript">Starting camera and AI... please wait.</div>
    </div>
  </div>

  <!-- Draggable & Resizable Camera Box -->
  <div class="camera-container" id="cameraBox">
    <div class="camera-header" id="camHeader">
      <span class="cam-title">🖐️ Drag Me</span>
      <div class="cam-controls">
        <button class="cam-btn" id="zoomOutBtn" title="Smaller">-</button>
        <button class="cam-btn" id="zoomInBtn" title="Bigger">+</button>
      </div>
    </div>
    <video class="input_video" autoplay playsinline muted></video>
    <canvas class="output_canvas" width="320" height="240"></canvas>
    <div class="cam-status">AI Active</div>
  </div>

  <div class="controls-bar">
    <button id="prevBtn">👈 Prev</button>
    <button id="playBtn" class="primary">▶ Speak</button>
    <button id="nextBtn">Next 👉</button>
    <button id="toggleGesturesBtn" class="gesture-on">🖐️ Gestures: ON</button>
    <button id="fullscreenBtn">📺 Fullscreen</button>
  </div>

<script>
  const slides = [
    { 
      title: "Opening Hook", 
      text: "📢 @SUYOG: Good afternoon, judges! We are Team Innovators—Suyog, Karisha, Sohan, and Samir. Today, we are presenting an Automated Early Flood Detection and Active Mitigation System!" 
    },
    { 
      title: "The Core Problem", 
      text: "⚡ @KARISHA: When a flash flood hits, human observation is simply too slow. By the time someone notices rising water and alerts the neighborhood, it’s too late. We replace manual checks with automated code." 
    },
    { 
      title: "System Logic & Code", 
      text: "💻 @SUYOG: Our logic runs on an Arduino loop: Sensor reads depth → Code checks against threshold in milliseconds → System fires alarm and servo motor driver instantly!" 
    },
    { 
      title: "Hardware Architecture", 
      text: "🛠️ @SOHAN: Our system layout: The Eyes (water depth sensor), The Brain (Arduino microcontroller), The Infrastructure (power breadboard), and The Muscle (buzzer & servo gate)." 
    },
    { 
      title: "Live Demonstration", 
      text: "🌊 @SAMIR: [Dips sensor in water] 1. Sensor detects rise. 2. Code evaluates threshold. 3. System triggers siren! [Buzzer] 4. Barrier deploys automatically! [Servo moves 90°]" 
    },
    { 
      title: "Closing & Impact", 
      text: "🏆 @KARISHA: From detection to physical defense in milliseconds—zero human delay! Thank you judges, we are now open to your questions." 
    }
  ];

  let currentIndex = 0;
  const slideTitle = document.getElementById('slideTitle');
  const slideScript = document.getElementById('slideScript');
  const slideIndicator = document.getElementById('slideIndicator');
  const toast = document.getElementById('toast');
  const cameraBox = document.getElementById('cameraBox');
  const synth = window.speechSynthesis;

  // Gesture Toggle State
  let gesturesEnabled = true;
  const toggleGesturesBtn = document.getElementById('toggleGesturesBtn');

  toggleGesturesBtn.addEventListener('click', () => {
    gesturesEnabled = !gesturesEnabled;
    if (gesturesEnabled) {
      toggleGesturesBtn.textContent = '🖐️ Gestures: ON';
      toggleGesturesBtn.className = 'gesture-on';
      cameraBox.style.display = 'block';
      showToast("Gestures Enabled");
    } else {
      toggleGesturesBtn.textContent = '🖐️ Gestures: OFF';
      toggleGesturesBtn.className = 'gesture-off';
      cameraBox.style.display = 'none';
      showToast("Gestures Disabled");
    }
  });

  function updateSlide() {
    slideTitle.textContent = slides[currentIndex].title;
    slideScript.textContent = slides[currentIndex].text;
    slideIndicator.textContent = `${currentIndex + 1}/${slides.length}`;
    synth.cancel();
  }

  function nextSlide() {
    if (currentIndex < slides.length - 1) {
      currentIndex++;
      updateSlide();
      showToast("👉 Next Slide");
    }
  }

  function prevSlide() {
    if (currentIndex > 0) {
      currentIndex--;
      updateSlide();
      showToast("👈 Previous Slide");
    }
  }

  function showToast(message) {
    toast.textContent = message;
    toast.style.opacity = '1';
    setTimeout(() => { toast.style.opacity = '0'; }, 1500);
  }

  document.getElementById('nextBtn').addEventListener('click', nextSlide);
  document.getElementById('prevBtn').addEventListener('click', prevSlide);
  document.getElementById('playBtn').addEventListener('click', () => {
    synth.cancel();
    const utterance = new SpeechSynthesisUtterance(slides[currentIndex].text);
    synth.speak(utterance);
  });
  
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight') nextSlide();
    if (e.key === 'ArrowLeft') prevSlide();
  });

  // Fullscreen support for Hikvision Smart Screen
  document.getElementById('fullscreenBtn').addEventListener('click', () => {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(() => {});
    } else {
      document.exitFullscreen().catch(() => {});
    }
  });

  updateSlide();

  // ==========================================
  // DRAG & RESIZE CAMERA BOX (Touch + Mouse)
  // ==========================================
  let isDragging = false;
  let startX, startY, initialLeft, initialTop;
  let cameraWidth = 280;

  const camHeader = document.getElementById('camHeader');

  function onDragStart(e) {
    isDragging = true;
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    
    startX = clientX;
    startY = clientY;
    
    const rect = cameraBox.getBoundingClientRect();
    initialLeft = rect.left;
    initialTop = rect.top;
    
    cameraBox.style.bottom = 'auto';
    cameraBox.style.right = 'auto';
    cameraBox.style.left = `${initialLeft}px`;
    cameraBox.style.top = `${initialTop}px`;
  }

  function onDragMove(e) {
    if (!isDragging) return;
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    
    const deltaX = clientX - startX;
    const deltaY = clientY - startY;
    
    cameraBox.style.left = `${initialLeft + deltaX}px`;
    cameraBox.style.top = `${initialTop + deltaY}px`;
  }

  function onDragEnd() {
    isDragging = false;
  }

  camHeader.addEventListener('mousedown', onDragStart);
  document.addEventListener('mousemove', onDragMove);
  document.addEventListener('mouseup', onDragEnd);

  camHeader.addEventListener('touchstart', onDragStart, { passive: true });
  document.addEventListener('touchmove', onDragMove, { passive: true });
  document.addEventListener('touchend', onDragEnd);

  // Resize Controls
  document.getElementById('zoomInBtn').addEventListener('click', (e) => {
    e.stopPropagation();
    if (cameraWidth < 600) {
      cameraWidth += 40;
      cameraBox.style.width = `${cameraWidth}px`;
      cameraBox.style.height = `${cameraWidth * 0.75}px`;
    }
  });

  document.getElementById('zoomOutBtn').addEventListener('click', (e) => {
    e.stopPropagation();
    if (cameraWidth > 160) {
      cameraWidth -= 40;
      cameraBox.style.width = `${cameraWidth}px`;
      cameraBox.style.height = `${cameraWidth * 0.75}px`;
    }
  });

  // ==========================================
  // STRICT FIST + THUMB TRACKING
  // ==========================================
  const videoElement = document.getElementsByClassName('input_video')[0];
  const canvasElement = document.getElementsByClassName('output_canvas')[0];
  const canvasCtx = canvasElement.getContext('2d');

  let lastGestureTime = 0;
  const gestureCooldown = 2000; 

  const hands = new Hands({locateFile: (file) => {
    return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
  }});

  hands.setOptions({
    maxNumHands: 1,
    modelComplexity: 1,
    minDetectionConfidence: 0.5,
    minTrackingConfidence: 0.5
  });

  hands.onResults(onResults);

  const camera = new Camera(videoElement, {
    onFrame: async () => { 
      if (gesturesEnabled) {
        await hands.send({image: videoElement}); 
      }
    },
    width: 320,
    height: 240
  });
  
  camera.start();

  function getDistance(p1, p2) {
    return Math.hypot(p1.x - p2.x, p1.y - p2.y);
  }

  function onResults(results) {
    if (!gesturesEnabled) return;

    canvasCtx.save();
    canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
    
    if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
      cameraBox.classList.add('tracking');

      const landmarks = results.multiHandLandmarks[0];
      drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, {color: '#00FF00', lineWidth: 2});
      drawLandmarks(canvasCtx, landmarks, {color: '#FF0000', lineWidth: 1});

      const now = Date.now();
      if (now - lastGestureTime > gestureCooldown) {
        
        const wrist = landmarks[0];
        const middleBase = landmarks[9];
        const handScale = getDistance(wrist, middleBase);
        
        const indexFolded = getDistance(landmarks[8], wrist) < getDistance(landmarks[6], wrist);
        const middleFolded = getDistance(landmarks[12], wrist) < getDistance(landmarks[10], wrist);
        const ringFolded = getDistance(landmarks[16], wrist) < getDistance(landmarks[14], wrist);
        const pinkyFolded = getDistance(landmarks[20], wrist) < getDistance(landmarks[18], wrist);

        const isFist = indexFolded && middleFolded && ringFolded && pinkyFolded;

        if (isFist) {
          const thumbTip = landmarks[4];
          const thumbBase = landmarks[2];
          const diffX = thumbTip.x - thumbBase.x;
          const diffY = thumbTip.y - thumbBase.y;

          if (Math.abs(diffX) > (handScale * 0.45) && Math.abs(diffX) > Math.abs(diffY) * 1.5) {
            
            if (diffX < - (handScale * 0.45)) { // Mirrored Right
              nextSlide();
              lastGestureTime = now;
            } 
            else if (diffX > (handScale * 0.45)) { // Mirrored Left
              prevSlide();
              lastGestureTime = now;
            }
          }
        }
      }
    } else {
      cameraBox.classList.remove('tracking');
    }
    canvasCtx.restore();
  }
</script>

</body>
</html>
