<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Teleprompter - Innovators Team</title>
  
  <!-- MediaPipe Hand Tracking Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <style>
    :root {
      --bg: #000000;
      --card: #111827;
      --accent: #3b82f6;
      --highlight: #f59e0b;
      --text: #ffffff;
      --text-muted: #9ca3af;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    .header {
      padding: 15px 30px;
      background: #111827;
      border-bottom: 1px solid #1f2937;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .header h1 {
      margin: 0;
      font-size: 1.5rem;
      color: var(--accent);
    }

    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px;
      position: relative;
    }

    /* Pro Teleprompter Text */
    .script-container {
      max-width: 1000px;
      width: 100%;
      text-align: center;
    }

    .slide-title {
      font-size: 1.8rem;
      color: var(--highlight);
      margin-bottom: 20px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .slide-script {
      font-size: 3.5rem; /* Huge text for easy reading */
      line-height: 1.4;
      font-weight: 600;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
    }

    /* Floating Controls */
    .controls-bar {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(17, 24, 39, 0.9);
      backdrop-filter: blur(10px);
      padding: 15px 25px;
      border-radius: 100px;
      display: flex;
      gap: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      border: 1px solid #374151;
      z-index: 20;
    }

    button {
      background: #374151;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover { background: #4b5563; }
    button.primary { background: var(--accent); }
    button.primary:hover { background: #2563eb; }

    /* Camera Feed */
    .camera-container {
      position: absolute;
      bottom: 30px;
      right: 30px;
      width: 240px;
      height: 180px;
      background: #111827;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid #374151;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      z-index: 20;
    }

    /* Mirror the video so it feels natural to the user */
    .input_video, .output_canvas {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      transform: scaleX(-1); /* Mirror effect */
    }

    .cam-status {
      position: absolute;
      bottom: 10px;
      left: 0;
      width: 100%;
      text-align: center;
      font-size: 0.8rem;
      color: #10b981;
      font-weight: bold;
      z-index: 2;
      text-shadow: 1px 1px 2px black;
    }

    /* Gesture Feedback Toast */
    .toast {
      position: absolute;
      top: 40px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(16, 185, 129, 0.9);
      color: white;
      padding: 15px 30px;
      font-size: 1.5rem;
      font-weight: bold;
      border-radius: 50px;
      opacity: 0;
      transition: opacity 0.3s;
      z-index: 50;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>Innovators Team | Golden Flower Secondary</h1>
    <div style="font-size:1.2rem; font-weight:bold;">Slide <span id="slideIndicator">1/8</span></div>
  </div>

  <!-- Gesture Alert -->
  <div id="toast" class="toast">👉 Next Slide</div>

  <div class="main-content">
    <div class="script-container">
      <div class="slide-title" id="slideTitle">Loading...</div>
      <div class="slide-script" id="slideScript">Starting camera and AI... please wait and allow permissions.</div>
    </div>
  </div>

  <!-- Camera / AI Feed -->
  <div class="camera-container" id="cameraBox">
    <video class="input_video" autoplay playsinline></video>
    <canvas class="output_canvas" width="320" height="240"></canvas>
    <div class="cam-status">AI Gestures Active ✋</div>
  </div>

  <!-- Controls -->
  <div class="controls-bar">
    <button id="prevBtn">👈 Prev</button>
    <button id="playBtn" class="primary">▶ Speak Slide</button>
    <button id="nextBtn">Next 👉</button>
  </div>

<script>
  const slides = [
    { title: "Introduction", text: "Hello everyone, we are the Innovators Team from Class 9 of Golden Flower Secondary School. Today, we are here to present to you about a robot that can save lives." },
    { title: "Slide 1: Problem Introduction", text: "Traditional water monitoring relies on slow, manual observation. This critical delay in alerting leads to severe structural damage and extreme safety hazards. We need a system that detects danger and acts instantly." },
    { title: "Slide 2: System Solution", text: "Our project acts as an automated digital watchman. By placing sensors in flood-prone zones, the system monitors water levels in real-time, 24/7. When water breaches the threshold, it triggers an alarm immediately." },
    { title: "Slide 3: Mechanical Defense", text: "Warning alone is not enough. Our system interfaces directly with mechanical barriers to physically block rising waters. The microcontroller dictates a motorized gate to deploy automatically." },
    { title: "Slide 4: Module Communication", text: "All components work together: The Water Level Sensor provides input. The Breadboard distributes power. The Arduino processes data. The Buzzer and Servo Motor receive commands to actuate defense." },
    { title: "Slide 5: Operational Flow", text: "Four automated steps: Detect rising waters. Analyze analog values. Alert via the high-decibel siren. Actuate the servo motor to deploy the physical flood gate." },
    { title: "Slide 6: Real-World Impact", text: "600 people are confirmed dead, with 3,000 missing across the region. By combining microelectronics with smart programming, we can build automated infrastructure that saves property and lives." },
    { title: "Slide 7: Conclusion", text: "Thank you. This concludes our presentation by the Innovators Team." }
  ];

  let currentIndex = 0;
  const slideTitle = document.getElementById('slideTitle');
  const slideScript = document.getElementById('slideScript');
  const slideIndicator = document.getElementById('slideIndicator');
  const toast = document.getElementById('toast');
  const synth = window.speechSynthesis;

  // Render Slide
  function updateSlide() {
    slideTitle.textContent = slides[currentIndex].title;
    slideScript.textContent = slides[currentIndex].text;
    slideIndicator.textContent = `${currentIndex + 1}/${slides.length}`;
    synth.cancel(); // Stop speaking if moving to new slide
  }

  // Next / Prev Logic
  function nextSlide() {
    if (currentIndex < slides.length - 1) {
      currentIndex++;
      updateSlide();
      showToast("👉 Next Slide");
    }
  }

  function prevSlide() {
    if (currentIndex > 0) {
      currentIndex--;
      updateSlide();
      showToast("👈 Previous Slide");
    }
  }

  function showToast(message) {
    toast.textContent = message;
    toast.style.opacity = '1';
    setTimeout(() => { toast.style.opacity = '0'; }, 1500);
  }

  // Button Listeners
  document.getElementById('nextBtn').addEventListener('click', nextSlide);
  document.getElementById('prevBtn').addEventListener('click', prevSlide);
  document.getElementById('playBtn').addEventListener('click', () => {
    synth.cancel();
    const utterance = new SpeechSynthesisUtterance(slides[currentIndex].text);
    synth.speak(utterance);
  });
  
  // Keyboard Navigation
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight') nextSlide();
    if (e.key === 'ArrowLeft') prevSlide();
  });

  updateSlide();

  // ==========================================
  // MEDIAPIPE AI GESTURE TRACKING
  // ==========================================
  const videoElement = document.getElementsByClassName('input_video')[0];
  const canvasElement = document.getElementsByClassName('output_canvas')[0];
  const canvasCtx = canvasElement.getContext('2d');

  let lastGestureTime = 0;
  const gestureCooldown = 2000; // 2 seconds between gestures to prevent double-skipping

  const hands = new Hands({locateFile: (file) => {
    return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
  }});

  hands.setOptions({
    maxNumHands: 1,
    modelComplexity: 1,
    minDetectionConfidence: 0.7,
    minTrackingConfidence: 0.7
  });

  hands.onResults(onResults);

  const camera = new Camera(videoElement, {
    onFrame: async () => {
      await hands.send({image: videoElement});
    },
    width: 320,
    height: 240
  });
  
  camera.start();

  function onResults(results) {
    canvasCtx.save();
    canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
    
    // We don't draw the video frame on the canvas because the video element is visible underneath
    
    if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
      const landmarks = results.multiHandLandmarks[0];
      
      // Draw skeleton on hands
      drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, {color: '#00FF00', lineWidth: 3});
      drawLandmarks(canvasCtx, landmarks, {color: '#FF0000', lineWidth: 2});

      const now = Date.now();
      if (now - lastGestureTime > gestureCooldown) {
        
        // Landmark 4 is Thumb Tip, Landmark 2 is Thumb Base
        const thumbTip = landmarks[4];
        const thumbBase = landmarks[2];
        
        // Calculate difference in X and Y
        const diffX = thumbTip.x - thumbBase.x;
        const diffY = thumbTip.y - thumbBase.y;

        // Ensure the thumb is pointing horizontally (X diff is greater than Y diff)
        if (Math.abs(diffX) > 0.08 && Math.abs(diffX) > Math.abs(diffY) * 1.5) {
          
          // Note: The camera image is mirrored via CSS. 
          // If you point to YOUR right, diffX in raw data is negative (left side of camera).
          if (diffX < -0.08) {
            nextSlide();
            lastGestureTime = now;
          } 
          // If you point to YOUR left, diffX is positive (right side of camera).
          else if (diffX > 0.08) {
            prevSlide();
            lastGestureTime = now;
          }
        }
      }
    }
    canvasCtx.restore();
  }
</script>

</body>
</html>
