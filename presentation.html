<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team Innovators | Presentation Teleprompter</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

<style>
  :root {
    --bg: #0a0f14;
    --bg-elevated: #0f161d;
    --surface: #151f28;
    --surface-2: #1b2732;
    --border: #263340;
    --text: #edf3f7;
    --text-muted: #8497a6;
    --cyan: #35d0e0;
    --cyan-dim: #1c8f9b;
    --amber: #f5a623;
    --red: #ff5252;
    --radius-lg: 20px;
    --radius-md: 12px;
    --radius-sm: 8px;
    --font-display: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
  }

  body {
    font-family: var(--font-display);
    background: var(--bg);
    color: var(--text);
    margin: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    opacity: 0.05;
    background-image:
      repeating-linear-gradient(0deg, transparent, transparent 39px, var(--cyan) 39px, var(--cyan) 40px);
    -webkit-mask-image: radial-gradient(ellipse at 50% 40%, black, transparent 75%);
    mask-image: radial-gradient(ellipse at 50% 40%, black, transparent 75%);
  }

  .sr-only {
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip: rect(0,0,0,0);
    white-space: nowrap; border: 0;
  }

  /* ---------- Header ---------- */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 14px clamp(16px, 3vw, 32px);
    background: var(--bg-elevated);
    border-bottom: 1px solid var(--border);
    z-index: 10;
    flex-wrap: wrap;
  }

  .brand {
    display: flex;
    flex-direction: column;
    line-height: 1.2;
  }

  .brand-name {
    font-size: clamp(1rem, 1.6vw, 1.2rem);
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.01em;
  }

  .brand-sub {
    font-size: clamp(0.72rem, 1.2vw, 0.85rem);
    color: var(--text-muted);
  }

  .progress-dots {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .progress-dots button {
    width: 9px;
    height: 9px;
    padding: 0;
    border-radius: 50%;
    background: var(--surface-2);
    border: 1px solid var(--border);
    cursor: pointer;
    transition: transform 0.15s ease, background 0.15s ease;
  }

  .progress-dots button:hover { transform: scale(1.25); }

  .progress-dots button.active {
    background: var(--cyan);
    border-color: var(--cyan);
    transform: scale(1.4);
  }

  /* ---------- Main slide area ---------- */
  .main-content {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: clamp(24px, 6vw, 64px);
    position: relative;
    z-index: 1;
    min-height: 0;
  }

  .script-container {
    max-width: 920px;
    width: 100%;
    text-align: center;
  }

  .speaker-tag {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: var(--font-mono);
    font-size: clamp(0.85rem, 1.6vw, 1.05rem);
    color: var(--cyan);
    background: rgba(53, 208, 224, 0.08);
    border: 1px solid rgba(53, 208, 224, 0.25);
    padding: 6px 14px;
    border-radius: 999px;
    margin-bottom: clamp(12px, 2vw, 20px);
  }

  .speaker-tag .prompt { color: var(--text-muted); }

  .delivery-hint {
    font-size: clamp(0.75rem, 1.2vw, 0.9rem);
    color: var(--amber);
    margin-bottom: clamp(14px, 2vw, 22px);
    font-family: var(--font-mono);
    opacity: 0.9;
  }

  .slide-title {
    font-size: clamp(1.3rem, 2.6vw, 2rem);
    font-weight: 700;
    color: var(--text);
    margin: 0 0 clamp(14px, 2.4vw, 22px);
    letter-spacing: -0.01em;
  }

  .slide-script {
    font-size: clamp(1.25rem, 3.2vw, 2.5rem);
    line-height: 1.5;
    font-weight: 400;
    color: #a2b4c3;
    word-wrap: break-word;
  }

  /* Imposing & emphasized speech */
  .slide-script strong {
    font-weight: 800;
    color: #ffffff;
    text-shadow: 0 0 12px rgba(53, 208, 224, 0.3);
    border-bottom: 2px solid var(--cyan);
    padding-bottom: 2px;
  }

  /* Physical actions / stage cues */
  .slide-script em {
    font-style: normal;
    color: var(--amber);
    font-weight: 600;
    background: rgba(245, 166, 35, 0.12);
    border: 1px solid rgba(245, 166, 35, 0.3);
    padding: 2px 8px;
    border-radius: 6px;
    font-size: 0.85em;
  }

  /* ---------- Camera panel ---------- */
  .camera-container {
    position: fixed;
    bottom: clamp(90px, 14vh, 110px);
    right: clamp(16px, 3vw, 30px);
    width: clamp(140px, 22vw, 220px);
    aspect-ratio: 4 / 3;
    background: var(--surface);
    border-radius: var(--radius-md);
    overflow: hidden;
    border: 1px solid var(--border);
    box-shadow: 0 8px 24px rgba(0,0,0,0.35);
    z-index: 30;
    transition: height 0.2s ease, opacity 0.2s ease, transform 0.2s ease;
  }

  .camera-container.off {
    display: none;
  }

  .camera-container.minimized {
    height: 30px !important;
    aspect-ratio: unset;
  }

  .camera-container.minimized video,
  .camera-container.minimized canvas {
    display: none;
  }

  .camera-header {
    position: absolute;
    top: 0; left: 0; width: 100%;
    height: 30px;
    background: rgba(10, 15, 20, 0.9);
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 10px;
    z-index: 5;
    font-size: 0.72rem;
    color: var(--text-muted);
  }

  .cam-controls {
    display: flex;
    gap: 4px;
  }

  .cam-btn {
    background: var(--surface-2);
    color: var(--text);
    border: 1px solid var(--border);
    width: 20px;
    height: 20px;
    line-height: 1;
    border-radius: 5px;
    cursor: pointer;
    font-size: 0.75rem;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .input_video, .output_canvas {
    width: 100%;
    height: 100%;
    position: absolute;
    top: 0; left: 0;
    transform: scaleX(-1);
    object-fit: cover;
  }

  /* ---------- Nav dock ---------- */
  .controls-dock {
    position: fixed;
    bottom: clamp(18px, 3vh, 28px);
    left: 50%;
    transform: translateX(-50%);
    z-index: 40;
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(21, 31, 40, 0.92);
    backdrop-filter: blur(8px);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 8px;
    transition: padding 0.2s ease, gap 0.2s ease;
  }

  .nav-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface-2);
    color: var(--text);
    border: 1px solid transparent;
    padding: 10px 20px;
    font-size: clamp(0.85rem, 1.6vw, 1rem);
    font-weight: 600;
    border-radius: 999px;
    cursor: pointer;
    transition: padding 0.2s ease, background 0.15s ease, opacity 0.15s ease, color 0.15s ease;
    white-space: nowrap;
  }

  .nav-btn:hover:not(:disabled) { background: var(--border); }

  .nav-btn:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }

  .nav-btn.primary {
    background: var(--cyan-dim);
    color: #062225;
  }

  .nav-btn.primary:hover:not(:disabled) { background: var(--cyan); }

  .nav-btn.toggle-active {
    border-color: rgba(53, 208, 224, 0.4);
  }

  .nav-btn.toggle-active.off {
    color: var(--text-muted);
    opacity: 0.7;
  }

  .nav-btn .icon { font-size: 1.05em; }

  .collapse-btn {
    background: transparent;
    color: var(--text-muted);
    border: 1px solid var(--border);
    width: 34px;
    height: 34px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 0.9rem;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .collapse-btn:hover { color: var(--text); border-color: var(--cyan-dim); }

  .controls-dock.minimized {
    padding: 6px;
    gap: 4px;
  }

  .controls-dock.minimized .nav-btn {
    padding: 8px 10px;
  }

  .controls-dock.minimized .nav-btn .label {
    display: none;
  }

  @media (max-width: 640px) {
    .header { padding: 12px 16px; }
    .camera-container {
      top: 68px;
      bottom: auto;
      right: 12px;
      width: 96px;
    }
    .controls-dock { bottom: 14px; }
    .nav-btn { padding: 9px 14px; }
  }

  @media (max-height: 480px) {
    .camera-container { display: none; }
  }
</style>
</head>
<body>

  <header class="header">
    <div class="brand">
      <span class="brand-name">Team Innovators</span>
      <span class="brand-sub">Automated Flood Detection &amp; Mitigation System</span>
    </div>
    <nav class="progress-dots" id="progressDots" aria-label="Jump to slide"></nav>
  </header>

  <main class="main-content">
    <div class="script-container">
      <div class="speaker-tag">
        <span class="prompt">$</span>
        <span id="speakerEmoji">📢</span>
        <span id="speakerName">Suyog</span>
      </div>
      <div class="delivery-hint">💬 Delivery Key: <strong>Bold = Imposing &amp; Emphasized</strong> | <em>[Italics] = Action Cues</em></div>
      <h1 class="slide-title" id="slideTitle">Opening Hook</h1>
      <p class="slide-script" id="slideScript">Loading presentation…</p>
    </div>
  </main>

  <span class="sr-only" id="slideAnnouncer" aria-live="polite"></span>

  <div class="camera-container" id="cameraBox">
    <div class="camera-header">
      <span>📷 Gesture cam</span>
      <div class="cam-controls">
        <button class="cam-btn" id="minCamBtn" aria-label="Minimize camera preview">–</button>
      </div>
    </div>
    <video class="input_video" autoplay playsinline muted></video>
    <canvas class="output_canvas" width="320" height="240"></canvas>
  </div>

  <div class="controls-dock" id="controlsDock">
    <button id="prevBtn" class="nav-btn">
      <span class="icon">←</span><span class="label">Previous</span>
    </button>
    
    <button id="cameraToggleBtn" class="nav-btn toggle-active">
      <span class="icon" id="camBtnIcon">📷</span><span class="label" id="camBtnLabel">Cam On</span>
    </button>

    <button id="nextBtn" class="nav-btn primary">
      <span class="icon">→</span><span class="label">Next</span>
    </button>
    <button id="collapseBtn" class="collapse-btn" aria-label="Minimize navigation controls" aria-pressed="false" title="Minimize controls">⌄</button>
  </div>

<script>
  const slides = [
    { 
      title: "Opening Hook", 
      speaker: "Suyog", 
      emoji: "📢",
      text: "Good afternoon, judges! We are <strong>Team Innovators</strong>—Suyog, Karisha, Sohan, and Samir. Today, we present an <strong>Automated Early Flood Detection and Active Risk Reduction System!</strong>" 
    },
    { 
      title: "The Core Problem", 
      speaker: "Karisha", 
      emoji: "⚡",
      text: "When a flash flood hits, human observation is <strong>simply too slow.</strong> By the time someone notices rising water, <strong>it's already too late.</strong> We replace manual checks with <strong>instant automated code.</strong>" 
    },
    { 
      title: "System Logic & Code", 
      speaker: "Suyog", 
      emoji: "💻",
      text: "Our code runs on an Arduino loop: sensors measure water depth, <strong>evaluate thresholds in milliseconds</strong>, and <strong>instantly trigger</strong> the alarm LEDs and servo barrier!" 
    },
    { 
      title: "Hardware Architecture", 
      speaker: "Sohan", 
      emoji: "🛠️",
      text: "Our physical layout: <strong>the eyes</strong> <em>[point to sensor]</em> water depth sensor, <strong>the brain</strong> <em>[point to Arduino]</em> microcontroller, and <strong>the muscle</strong> <em>[point to barrier]</em> active servo gate." 
    },
    { 
      title: "Live Demonstration", 
      speaker: "Samir", 
      emoji: "🌊",
      text: "<em>[Dips sensor in water]</em> 1. Sensor detects rise. 2. Code evaluates threshold. 3. <strong>System fires alarm!</strong> <em>[LEDs light up]</em> 4. <strong>Barrier deploys instantly!</strong> <em>[Servo moves 90°]</em>" 
    },
    { 
      title: "Closing & Impact", 
      speaker: "Karisha", 
      emoji: "🏆",
      text: "From detection to physical defense in milliseconds — <strong>ZERO human delay!</strong> Thank you, judges. We are now open for your questions." 
    }
  ];

  let currentIndex = 0;

  const slideTitle = document.getElementById('slideTitle');
  const slideScript = document.getElementById('slideScript');
  const speakerName = document.getElementById('speakerName');
  const speakerEmoji = document.getElementById('speakerEmoji');
  const progressDotsEl = document.getElementById('progressDots');
  const slideAnnouncer = document.getElementById('slideAnnouncer');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');

  // Build progress dots
  slides.forEach((slide, i) => {
    const dot = document.createElement('button');
    dot.type = 'button';
    dot.setAttribute('aria-label', `Go to slide ${i + 1}: ${slide.title}`);
    dot.addEventListener('click', () => goToSlide(i));
    progressDotsEl.appendChild(dot);
  });

  function renderDots() {
    const dots = progressDotsEl.querySelectorAll('button');
    dots.forEach((dot, i) => dot.classList.toggle('active', i === currentIndex));
  }

  function updateSlide() {
    const slide = slides[currentIndex];
    slideTitle.textContent = slide.title;
    slideScript.innerHTML = slide.text; // Render HTML tags (strong, em)
    speakerName.textContent = slide.speaker;
    speakerEmoji.textContent = slide.emoji;
    prevBtn.disabled = currentIndex === 0;
    nextBtn.disabled = currentIndex === slides.length - 1;
    renderDots();
    slideAnnouncer.textContent = `Slide ${currentIndex + 1} of ${slides.length}: ${slide.title}`;
  }

  function goToSlide(index) {
    if (index < 0 || index >= slides.length || index === currentIndex) return;
    currentIndex = index;
    updateSlide();
  }

  function nextSlide() { goToSlide(currentIndex + 1); }
  function prevSlide() { goToSlide(currentIndex - 1); }

  nextBtn.addEventListener('click', nextSlide);
  prevBtn.addEventListener('click', prevSlide);

  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight') nextSlide();
    if (e.key === 'ArrowLeft') prevSlide();
  });

  updateSlide();

  // ---------- Minimize camera preview ----------
  const cameraBox = document.getElementById('cameraBox');
  const minCamBtn = document.getElementById('minCamBtn');
  let camMinimized = false;
  minCamBtn.addEventListener('click', () => {
    camMinimized = !camMinimized;
    cameraBox.classList.toggle('minimized', camMinimized);
    minCamBtn.textContent = camMinimized ? '+' : '–';
    minCamBtn.setAttribute('aria-label', camMinimized ? 'Restore camera preview' : 'Minimize camera preview');
  });

  // ---------- Minimize nav controls dock ----------
  const controlsDock = document.getElementById('controlsDock');
  const collapseBtn = document.getElementById('collapseBtn');
  let dockMinimized = false;
  collapseBtn.addEventListener('click', () => {
    dockMinimized = !dockMinimized;
    controlsDock.classList.toggle('minimized', dockMinimized);
    collapseBtn.textContent = dockMinimized ? '⌃' : '⌄';
    collapseBtn.setAttribute('aria-pressed', String(dockMinimized));
    collapseBtn.setAttribute('title', dockMinimized ? 'Expand controls' : 'Minimize controls');
    collapseBtn.setAttribute('aria-label', dockMinimized ? 'Expand navigation controls' : 'Minimize navigation controls');
  });

  // ---------- MediaPipe Hand-Gesture Camera Setup ----------
  let lastGestureTime = 0;
  const GESTURE_COOLDOWN = 1000;
  let cameraInstance = null;
  let isCameraOn = false;

  const videoElement = document.getElementsByClassName('input_video')[0];
  const canvasElement = document.getElementsByClassName('output_canvas')[0];
  const canvasCtx = canvasElement.getContext('2d');

  const hands = new Hands({
    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
  });

  hands.setOptions({
    maxNumHands: 1,
    modelComplexity: 1,
    minDetectionConfidence: 0.5,
    minTrackingConfidence: 0.5
  });

  hands.onResults((results) => {
    if (!isCameraOn) return;
    canvasCtx.save();
    canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
    canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

    if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
      for (const landmarks of results.multiHandLandmarks) {
        drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, { color: '#35d0e0', lineWidth: 2 });
        drawLandmarks(canvasCtx, landmarks, { color: '#f5a623', lineWidth: 1, radius: 2 });

        const now = Date.now();
        if (now - lastGestureTime > GESTURE_COOLDOWN) {
          const indexTip = landmarks[8];
          const wrist = landmarks[0];

          if (indexTip.x < wrist.x - 0.25) {
            nextSlide();
            lastGestureTime = now;
          } else if (indexTip.x > wrist.x + 0.25) {
            prevSlide();
            lastGestureTime = now;
          }
        }
      }
    }
    canvasCtx.restore();
  });

  async function startCamera() {
    try {
      if (!cameraInstance) {
        cameraInstance = new Camera(videoElement, {
          onFrame: async () => {
            if (isCameraOn) {
              await hands.send({ image: videoElement });
            }
          },
          width: 320,
          height: 240
        });
      }
      await cameraInstance.start();
      isCameraOn = true;
      cameraBox.classList.remove('off');
      updateCamBtnUI(true);
    } catch (err) {
      console.error("Failed to start camera: ", err);
      isCameraOn = false;
      updateCamBtnUI(false);
    }
  }

  function stopCamera() {
    isCameraOn = false;
    if (videoElement.srcObject) {
      const tracks = videoElement.srcObject.getTracks();
      tracks.forEach(track => track.stop());
      videoElement.srcObject = null;
    }
    cameraBox.classList.add('off');
    updateCamBtnUI(false);
  }

  function toggleCamera() {
    if (isCameraOn) {
      stopCamera();
    } else {
      startCamera();
    }
  }

  const cameraToggleBtn = document.getElementById('cameraToggleBtn');
  const camBtnIcon = document.getElementById('camBtnIcon');
  const camBtnLabel = document.getElementById('camBtnLabel');

  function updateCamBtnUI(active) {
    if (active) {
      cameraToggleBtn.classList.remove('off');
      camBtnIcon.textContent = '📷';
      camBtnLabel.textContent = 'Cam On';
    } else {
      cameraToggleBtn.classList.add('off');
      camBtnIcon.textContent = '🚫';
      camBtnLabel.textContent = 'Cam Off';
    }
  }

  cameraToggleBtn.addEventListener('click', toggleCamera);

  // Auto start camera on page load
  startCamera();
</script>
</body>
</html>
