<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ग्यास अर्डर तथा बुकिङ | LPG Gas Order & Booking</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@500;600;700;800&family=Noto+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-page: #E4E8ED;
    --paper: #F8FAFC;
    --ink: #0F172A;
    --ink-soft: #475569;
    --brand-red: #DC2626;
    --brand-red-dark: #B91C1C;
    --brand-blue: #1D4ED8;
    --accent: #F59E0B;
    --ok-bg: #ECFDF5;
    --ok-fg: #047857;
    --err-bg: #FEF2F2;
    --err-fg: #B91C1C;
    --radius: 18px;
    --border: #E2E8F0;
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    height: 100%;
  }

  body {
    margin: 0;
    font-family: 'Noto Sans', 'Noto Sans Devanagari', sans-serif;
    background-color: var(--bg-page);
    background-image: radial-gradient(#CBD5E1 1px, transparent 0);
    background-size: 24px 24px;
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }

  .ticket {
    width: 100%;
    max-width: 420px;
    background: #fff;
    border-radius: var(--radius);
    box-shadow: 
      0 24px 48px -12px rgba(15, 23, 42, 0.25), 
      0 0 0 1px rgba(15, 23, 42, 0.05);
    overflow: hidden;
  }

  /* --- The Shop Awning Header --- */
  .stub {
    /* 3D shading + Red/Blue storefront stripes */
    background: 
      linear-gradient(to bottom, rgba(255,255,255,0.15) 0%, rgba(0,0,0,0.3) 100%),
      repeating-linear-gradient(
        to right,
        var(--brand-red) 0,
        var(--brand-red) 40px,
        var(--brand-blue) 40px,
        var(--brand-blue) 80px
      );
    color: #fff;
    padding: 32px 24px 44px;
    position: relative;
    text-align: center;
  }

  .flame-container {
    width: 64px;
    height: 64px;
    margin: 0 auto 16px;
    background: #fff;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 16px rgba(0,0,0,0.15);
  }

  .flame-mark {
    width: 36px;
    height: 36px;
  }

  .stub h1 {
    margin: 0;
    font-size: 1.55rem;
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1.2;
    text-shadow: 0 2px 4px rgba(0,0,0,0.4);
  }

  .stub .np {
    font-family: 'Noto Sans Devanagari', sans-serif;
    font-weight: 700;
    font-size: 1.05rem;
    margin-top: 4px;
    color: #E2E8F0;
    text-shadow: 0 1px 2px rgba(0,0,0,0.4);
  }

  /* Pure CSS Scalloped Flaps (No SVG) */
  .perf {
    height: 20px;
    background: #fff;
    position: relative;
  }

  .perf::before {
    content: "";
    position: absolute;
    top: -20px; 
    left: 0; 
    right: 0;
    height: 20px;
    /* This creates white arcs pushing UP, leaving colored flaps hanging DOWN */
    background-image: radial-gradient(circle at 20px 20px, #fff 20px, transparent 20.5px);
    background-size: 40px 20px; 
    background-position: -20px top; 
    background-repeat: repeat-x;
  }

  /* --- Body & Form --- */
  .body {
    padding: 16px 28px 32px;
  }

  .view-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
    gap: 12px;
  }

  .view-title {
    font-weight: 800;
    color: var(--ink);
    font-size: 1.25rem;
    margin: 0;
  }

  .switch-link {
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--brand-blue);
    text-decoration: none;
    padding: 8px 12px;
    border-radius: 8px;
    background: rgba(29, 78, 216, 0.08);
    transition: all 0.2s ease;
    white-space: nowrap;
    cursor: pointer;
  }

  .switch-link:hover {
    background: rgba(29, 78, 216, 0.15);
    color: var(--brand-red);
  }

  /* Status Messages */
  .status {
    display: none;
    margin-bottom: 20px;
    padding: 14px 16px;
    border-radius: 12px;
    font-weight: 600;
    font-size: 0.92rem;
    line-height: 1.4;
    border: 1px solid transparent;
  }

  .status.success {
    display: block;
    background: var(--ok-bg);
    color: var(--ok-fg);
    border-color: #A7F3D0;
  }

  .status.error {
    display: block;
    background: var(--err-bg);
    color: var(--err-fg);
    border-color: #FECACA;
  }

  /* Input Fields */
  .field {
    margin-bottom: 20px;
  }

  .field label {
    display: block;
    font-weight: 700;
    font-size: 0.88rem;
    color: var(--ink);
    margin-bottom: 8px;
  }

  .field label .np {
    font-family: 'Noto Sans Devanagari', sans-serif;
    font-weight: 600;
    margin-left: 4px;
    color: var(--ink-soft);
  }

  input, select {
    width: 100%;
    padding: 14px 16px;
    border: 2px solid var(--border);
    border-radius: 12px;
    background: #fff;
    color: var(--ink);
    font-size: 16px;
    font-weight: 500;
    font-family: inherit;
    appearance: none;
    -webkit-appearance: none;
    transition: all 0.2s ease;
  }

  select {
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23475569' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
    background-repeat: no-repeat;
    background-position: right 16px center;
    background-size: 16px;
    padding-right: 48px;
  }

  input:focus, select:focus {
    outline: none;
    border-color: var(--brand-blue);
    box-shadow: 0 0 0 4px rgba(29, 78, 216, 0.12);
  }

  input.invalid {
    border-color: var(--brand-red);
    background: #FEF2F2;
  }

  .field-msg {
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--brand-red-dark);
    margin-top: 6px;
    display: none;
  }

  .field-msg.show {
    display: block;
  }

  /* Quantity Control */
  .qty-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .qty-row input {
    text-align: center;
    font-weight: 700;
    max-width: 80px;
    font-size: 18px;
  }

  input[type="number"]::-webkit-inner-spin-button,
  input[type="number"]::-webkit-outer-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }
  input[type="number"] { -moz-appearance: textfield; }

  .qty-btn {
    flex: 0 0 auto;
    width: 52px;
    height: 52px;
    border-radius: 12px;
    border: 2px solid var(--border);
    background: var(--paper);
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--ink);
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .qty-btn:hover {
    background: var(--border);
  }

  .qty-btn:active {
    transform: scale(0.96);
  }

  /* Submit Button */
  button.submit {
    width: 100%;
    padding: 16px;
    margin-top: 12px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(180deg, var(--brand-red) 0%, #B91C1C 100%);
    color: #fff;
    font-size: 1.05rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    cursor: pointer;
    box-shadow: 
      0 4px 6px -1px rgba(220, 38, 38, 0.3), 
      0 2px 4px -1px rgba(220, 38, 38, 0.2), 
      inset 0 1px 0 rgba(255,255,255,0.25);
    transition: all 0.2s ease;
  }

  button.submit:hover {
    transform: translateY(-2px);
    box-shadow: 
      0 8px 12px -2px rgba(220, 38, 38, 0.35), 
      0 4px 6px -2px rgba(220, 38, 38, 0.25), 
      inset 0 1px 0 rgba(255,255,255,0.3);
  }

  button.submit:active {
    transform: translateY(0);
  }

  button.submit:disabled {
    opacity: 0.7;
    cursor: not-allowed;
    transform: none;
  }

  .hide { display: none !important; }

  /* Receipt / Ticket Inner */
  #receipt {
    background: #fff;
    border: 2px dashed var(--border);
    border-radius: 16px;
    padding: 24px;
    margin-top: 8px;
  }

  .receipt-id {
    text-align: center;
    padding-bottom: 20px;
  }

  .receipt-id .label {
    font-size: 0.8rem;
    color: var(--ink-soft);
    font-weight: 800;
    letter-spacing: 0.05em;
  }

  .receipt-id .value {
    font-size: 1.85rem;
    font-weight: 800;
    color: var(--brand-blue);
    margin-top: 4px;
  }

  .receipt-rows {
    border-top: 2px dashed var(--border);
    padding-top: 16px;
  }

  .receipt-row {
    display: flex;
    justify-content: space-between;
    gap: 14px;
    padding: 10px 0;
    font-size: 0.98rem;
  }

  .receipt-row span:first-child {
    color: var(--ink-soft);
    font-weight: 600;
  }

  .receipt-row span:last-child {
    font-weight: 800;
    text-align: right;
    color: var(--ink);
  }

  .new-order-btn {
    width: 100%;
    margin-top: 24px;
    padding: 16px;
    border-radius: 12px;
    border: 2px solid var(--brand-blue);
    background: #fff;
    color: var(--brand-blue);
    font-weight: 800;
    font-size: 1rem;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .new-order-btn:hover {
    background: var(--brand-blue);
    color: #fff;
  }
</style>
</head>
<body>
<div class="ticket">
  <div class="stub">
    <div class="flame-container">
      <svg class="flame-mark" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M24 4c1 7-6 9-6 16a6 6 0 0 0 12 0c2 2 3 5 3 8a9 9 0 1 1-18 0c0-9 7-12 9-24z" fill="#F59E0B"/>
        <path d="M24 16c0 4-4 5-4 10a4 4 0 0 0 8 0c1 1 1.5 2.5 1.5 4a5.5 5.5 0 1 1-11 0c0-6 4-8 5.5-14z" fill="#DC2626"/>
      </svg>
    </div>
    <h1>LPG Gas Services</h1>
    <div class="np">ग्यास अर्डर तथा बुकिङ</div>
  </div>

  <div class="perf"></div>

  <div class="body">
    <div id="statusBox" class="status"></div>

    <div id="formContainer">
      <div class="view-header">
        <h2 class="view-title" id="viewTitle">Direct Order</h2>
        <a class="switch-link" id="toggleViewBtn">Booking Mode →</a>
      </div>

      <form id="gasForm" novalidate>
        <div class="field">
          <label>Customer Name <span class="np">नाम</span></label>
          <input type="text" id="name" required placeholder="Ram Bahadur" autocomplete="name">
          <div class="field-msg" id="nameMsg">Please enter your name.</div>
        </div>

        <div class="field">
          <label>Phone Number <span class="np">फोन नम्बर</span></label>
          <input type="tel" id="phone" required placeholder="98XXXXXXXX" maxlength="10" inputmode="numeric" autocomplete="tel">
          <div class="field-msg" id="phoneMsg">Valid 10-digit number required.</div>
        </div>

        <div class="field">
          <label>Gas Brand <span class="np">ब्रान्ड</span></label>
          <select id="brand">
            <option value="Lokpriya Gas">Lokpriya Gas / लोकप्रिय ग्यास</option>
            <option value="Manoj Gas">Manoj Gas / मनोज ग्यास</option>
          </select>
        </div>

        <div id="directOrderFields">
          <div class="field">
            <label>Order Type <span class="np">प्रकार</span></label>
            <select id="type">
              <option value="Immediate Refill">Refill Ready / अहिले साट्ने</option>
              <option value="New Cylinder">New Cylinder / नयाँ किन्ने</option>
            </select>
          </div>
        </div>

        <div id="bookingFields" class="hide">
          <div class="field">
            <label>Empty Cylinder Status <span class="np">खाली सिलिन्डर</span></label>
            <select id="emptyCylinder">
              <option value="Dropped Off">Dropped Off / खाली छाडेको छ</option>
              <option value="Will Drop Later">Will Drop Later / पछि लिएर आउने</option>
            </select>
          </div>
          <div class="field">
            <label>Payment Status <span class="np">भुक्तानी स्थिति</span></label>
            <select id="paymentStatus">
              <option value="Unpaid">Unpaid / पैसा तिर्न बाँकी</option>
              <option value="Paid in Advance">Paid in Advance / नगद बुझाइसक्यो</option>
            </select>
          </div>
        </div>

        <div class="field">
          <label>Quantity <span class="np">संख्या</span></label>
          <div class="qty-row">
            <button type="button" class="qty-btn" id="qtyDown" aria-label="Decrease quantity">–</button>
            <input type="number" id="quantity" min="1" max="99" value="1" inputmode="numeric" pattern="[0-9]*">
            <button type="button" class="qty-btn" id="qtyUp" aria-label="Increase quantity">+</button>
          </div>
        </div>

        <button type="submit" class="submit" id="submitBtn">Place Order</button>
      </form>
    </div>

    <!-- Receipt -->
    <div id="receipt" class="hide">
      <div class="receipt-id">
        <div class="label" id="rCategoryLabel">ORDER CONFIRMED</div>
        <div class="value" id="rOrderId">—</div>
      </div>
      <div class="receipt-rows">
        <div class="receipt-row"><span>Name</span><span id="rName">—</span></div>
        <div class="receipt-row"><span>Phone</span><span id="rPhone">—</span></div>
        <div class="receipt-row"><span>Brand</span><span id="rBrand">—</span></div>
        <div class="receipt-row" id="rTypeRow"><span>Type</span><span id="rType">—</span></div>
        <div class="receipt-row hide" id="rEmptyRow"><span>Empty</span><span id="rEmpty">—</span></div>
        <div class="receipt-row hide" id="rPaymentRow"><span>Payment</span><span id="rPayment">—</span></div>
        <div class="receipt-row"><span>Quantity</span><span id="rQty">—</span></div>
      </div>
      <button type="button" class="new-order-btn" id="newOrderBtn">Done</button>
    </div>
  </div>
</div>

<script>
(function () {
  const GOOGLE_APP_URL = "https://script.google.com/macros/s/AKfycbyDwzk5dSBcLzhUgh-bv0bIksfxu0nj__RbbBsucnIkw5hadijeVaKD54ymP1y-tTCy/exec";

  const form = document.getElementById('gasForm');
  const directFields = document.getElementById('directOrderFields');
  const bookingFields = document.getElementById('bookingFields');
  const viewTitle = document.getElementById('viewTitle');
  const toggleBtn = document.getElementById('toggleViewBtn');
  const submitBtn = document.getElementById('submitBtn');
  const statusBox = document.getElementById('statusBox');

  let isBookingMode = false;

  toggleBtn.addEventListener('click', () => {
    isBookingMode = !isBookingMode;
    if (isBookingMode) {
      viewTitle.textContent = "Advance Booking";
      toggleBtn.innerHTML = "← Order Mode";
      directFields.classList.add('hide');
      bookingFields.classList.remove('hide');
      submitBtn.textContent = "Confirm Booking";
    } else {
      viewTitle.textContent = "Direct Order";
      toggleBtn.innerHTML = "Booking Mode →";
      directFields.classList.remove('hide');
      bookingFields.classList.add('hide');
      submitBtn.textContent = "Place Order";
    }
  });

  const qtyEl = document.getElementById('quantity');
  qtyEl.addEventListener('keydown', (e) => {
    if (['e', 'E', '+', '-', '.'].includes(e.key)) e.preventDefault();
  });
  qtyEl.addEventListener('input', () => {
    qtyEl.value = qtyEl.value.replace(/[^0-9]/g, '');
  });
  qtyEl.addEventListener('blur', () => {
    if (!qtyEl.value || parseInt(qtyEl.value, 10) < 1) qtyEl.value = 1;
  });

  document.getElementById('qtyDown').onclick = () => {
    qtyEl.value = Math.max(1, (parseInt(qtyEl.value, 10) || 1) - 1);
  };
  document.getElementById('qtyUp').onclick = () => {
    qtyEl.value = (parseInt(qtyEl.value, 10) || 0) + 1;
  };

  const nameEl = document.getElementById('name');
  const phoneEl = document.getElementById('phone');

  function validate() {
    const nValid = nameEl.value.trim().length >= 2;
    const pValid = /^9[678]\d{8}$/.test(phoneEl.value.trim());
    nameEl.classList.toggle('invalid', !nValid);
    document.getElementById('nameMsg').classList.toggle('show', !nValid);
    phoneEl.classList.toggle('invalid', !pValid);
    document.getElementById('phoneMsg').classList.toggle('show', !pValid);
    return nValid && pValid;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    statusBox.style.display = 'none';
    statusBox.className = 'status';

    if (!validate()) {
      statusBox.textContent = "Please fix the highlighted fields.";
      statusBox.className = "status error";
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = "Processing...";

    const payload = {
      orderId: (isBookingMode ? 'BKG-' : 'ORD-') + Math.floor(1000 + Math.random() * 9000),
      timestamp: new Date().toLocaleString(),
      orderCategory: isBookingMode ? "Advance Booking" : "Direct Order",
      name: nameEl.value.trim(),
      phone: phoneEl.value.trim(),
      brand: document.getElementById('brand').value,
      quantity: qtyEl.value || "1",
      type: isBookingMode ? "N/A" : document.getElementById('type').value,
      emptyCylinder: isBookingMode ? document.getElementById('emptyCylinder').value : "N/A",
      paymentStatus: isBookingMode ? document.getElementById('paymentStatus').value : "N/A"
    };

    try {
      if (GOOGLE_APP_URL) {
        await fetch(GOOGLE_APP_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
      }
      showReceipt(payload);
    } catch (err) {
      statusBox.textContent = "Failed to submit. Please try again.";
      statusBox.className = "status error";
    }

    submitBtn.disabled = false;
    submitBtn.textContent = isBookingMode ? "Confirm Booking" : "Place Order";
  });

  function showReceipt(o) {
    document.getElementById('formContainer').classList.add('hide');
    document.getElementById('receipt').classList.remove('hide');

    document.getElementById('rCategoryLabel').textContent = o.orderCategory.toUpperCase() + " CONFIRMED";
    document.getElementById('rOrderId').textContent = o.orderId;
    document.getElementById('rName').textContent = o.name;
    document.getElementById('rPhone').textContent = o.phone;
    document.getElementById('rBrand').textContent = o.brand;
    document.getElementById('rQty').textContent = o.quantity;

    if (isBookingMode) {
      document.getElementById('rTypeRow').classList.add('hide');
      document.getElementById('rEmptyRow').classList.remove('hide');
      document.getElementById('rPaymentRow').classList.remove('hide');
      document.getElementById('rEmpty').textContent = o.emptyCylinder;
      document.getElementById('rPayment').textContent = o.paymentStatus;
    } else {
      document.getElementById('rTypeRow').classList.remove('hide');
      document.getElementById('rEmptyRow').classList.add('hide');
      document.getElementById('rPaymentRow').classList.add('hide');
      document.getElementById('rType').textContent = o.type;
    }
  }

  document.getElementById('newOrderBtn').onclick = () => {
    form.reset();
    qtyEl.value = 1;
    nameEl.classList.remove('invalid');
    phoneEl.classList.remove('invalid');
    document.getElementById('nameMsg').classList.remove('show');
    document.getElementById('phoneMsg').classList.remove('show');
    statusBox.className = 'status';
    document.getElementById('receipt').classList.add('hide');
    document.getElementById('formContainer').classList.remove('hide');
  };
})();
</script>
</body>
</html>
