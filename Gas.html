<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LPG Gas Order / ग्यास अर्डर</title>
    <style>
        body { font-family: Arial, sans-serif; background: #eef2f5; padding: 15px; font-size: 18px; margin: 0; }
        .card { max-width: 500px; margin: auto; background: white; padding: 25px; border-radius: 10px; border-top: 6px solid #d32f2f; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #d32f2f; margin-bottom: 5px; }
        label { font-weight: bold; display: block; margin-top: 15px; }
        input, select { width: 100%; padding: 12px; margin-top: 5px; border: 2px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; background: #2e7d32; color: white; padding: 15px; border: none; border-radius: 5px; margin-top: 20px; font-size: 18px; font-weight: bold; cursor: pointer; }
        button:disabled { background: #888; }
        .status { margin-top: 15px; padding: 10px; border-radius: 5px; text-align: center; font-weight: bold; display: none; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>

<div class="card">
    <h2>🔥 LPG Gas Order / ग्यास अर्डर</h2>
    <div id="statusBox" class="status"></div>

    <form id="orderForm">
        <label>Customer Name / नाम:</label>
        <input type="text" id="name" required placeholder="Ram Bahadur / राम बहादुर">

        <label>Phone Number / फोन नम्बर:</label>
        <input type="tel" id="phone" required placeholder="98XXXXXXXX">

        <label>Gas Brand / ब्रान्ड:</label>
        <select id="brand">
            <option value="Nepal Gas">Nepal Gas</option>
            <option value="Bhadrakali">Bhadrakali</option>
            <option value="Suryodaya">Suryodaya</option>
            <option value="Everest">Everest</option>
            <option value="Sugam">Sugam</option>
            <option value="Shakti">Shakti</option>
        </select>

        <label>Order Type / प्रकार:</label>
        <select id="type">
            <option value="Refill">Refill Only / साट्ने</option>
            <option value="New Cylinder">New Cylinder / नयाँ सिलिन्डर</option>
        </select>

        <label>Quantity / संख्या:</label>
        <input type="number" id="quantity" min="1" max="10" value="1" required>

        <button type="submit" id="submitBtn">Place Order / अर्डर गर्नुहोस्</button>
    </form>
</div>

<script>
    const API_ENDPOINT = "https://api.jsonbin.io/v3/b/6aa6d321ffd5d1605301f943"; // Replace with your Bin ID
    const API_KEY = "$2a$10$aIpiPKEbt5kEXJ2DVkgVrONA8a83VpJklYaNkvqyDae20azlXbr0.";                              // Replace with your API Key

    let clientIP = "Unknown";
    fetch('https://api.ipify.org?format=json')
        .then(res => res.json())
        .then(data => clientIP = data.ip)
        .catch(() => clientIP = "Unavailable");

    const form = document.getElementById('orderForm');
    const submitBtn = document.getElementById('submitBtn');
    const statusBox = document.getElementById('statusBox');

    form.addEventListener('submit', async function(e) {
        e.preventDefault();

        // 5-Second Delay / Cooldown check using browser storage
        const lastSubmit = localStorage.getItem('last_order_time');
        const now = Date.now();
        if (lastSubmit && (now - lastSubmit < 5000)) {
            const waitTime = Math.ceil((5000 - (now - lastSubmit)) / 1000);
            showStatus(`Please wait ${waitTime} seconds before ordering again. / कृपया ${waitTime} सेकेन्ड पर्खनुहोस्।`, 'error');
            return;
        }

        submitBtn.disabled = true;
        submitBtn.innerText = "Processing / अर्डर हुँदैछ...";

        const newOrder = {
            orderId: "LPG-" + Math.floor(1000 + Math.random() * 9000),
            timestamp: new Date().toLocaleString(),
            ip: clientIP,
            name: document.getElementById('name').value,
            phone: document.getElementById('phone').value,
            brand: document.getElementById('brand').value,
            type: document.getElementById('type').value,
            quantity: document.getElementById('quantity').value
        };

        try {
            // Get existing orders from cloud storage
            let response = await fetch(API_ENDPOINT, { headers: { '$2a$10$aIpiPKEbt5kEXJ2DVkgVrONA8a83VpJklYaNkvqyDae20azlXbr0.': API_KEY } });
            let data = await response.json();
            let currentOrders = data.record.orders || [];

            // Add new order to array
            currentOrders.push(newOrder);

            // Update database
            await fetch(API_ENDPOINT, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', '$2a$10$aIpiPKEbt5kEXJ2DVkgVrONA8a83VpJklYaNkvqyDae20azlXbr0.': API_KEY },
                body: JSON.stringify({ orders: currentOrders })
            });

            localStorage.setItem('last_order_time', Date.now());
            showStatus("Order Placed Successfully! / अर्डर सफल भयो!", 'success');
            form.reset();
        } catch (err) {
            showStatus("Order failed. Check internet connection. / अर्डर असफल भयो।", 'error');
        }

        submitBtn.disabled = false;
        submitBtn.innerText = "Place Order / अर्डर गर्नुहोस्";
    });

    function showStatus(text, type) {
        statusBox.innerText = text;
        statusBox.className = `status ${type}`;
        statusBox.style.display = 'block';
    }
</script>
</body>
</html>
