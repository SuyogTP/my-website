<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>LPG Gas Order / ग्यास अर्डर</title>
    <style>
        :root {
            --primary: #d32f2f;
            --primary-hover: #b71c1c;
            --secondary: #2e7d32;
            --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            --card-shadow: 0 15px 35px rgba(0, 0, 0, 0.1), 0 5px 15px rgba(0, 0, 0, 0.05);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif; 
            background: var(--bg-gradient); 
            min-height: 100vh;
            margin: 0; 
            padding: 24px 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #2c3e50;
        }

        .card { 
            width: 100%;
            max-width: 460px; 
            background: #ffffff; 
            padding: 32px 24px; 
            border-radius: 20px; 
            box-shadow: var(--card-shadow); 
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 6px;
            background: linear-gradient(90deg, #d32f2f, #ff1744);
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header-icon {
            font-size: 42px;
            margin-bottom: 4px;
            display: inline-block;
        }

        h2 { 
            color: #1a1a1a; 
            margin: 0; 
            font-size: 1.6rem; 
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: #7f8c8d;
            font-size: 0.95rem;
            margin-top: 4px;
            font-weight: 500;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label { 
            font-weight: 600; 
            display: block; 
            margin-bottom: 6px; 
            color: #34495e; 
            font-size: 0.9rem;
        }

        input, select { 
            width: 100%; 
            padding: 14px 16px; 
            border: 2px solid #e2e8f0; 
            border-radius: 12px; 
            box-sizing: border-box; 
            font-size: 16px; /* Prevents auto-zoom on iOS */
            background: #f8fafc;
            color: #1e293b;
            transition: all 0.25s ease;
            appearance: none;
            -webkit-appearance: none;
        }

        select {
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%36474f' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 14px center;
            background-size: 18px;
            padding-right: 42px;
        }

        input:focus, select:focus { 
            outline: none; 
            border-color: var(--primary); 
            background: #ffffff; 
            box-shadow: 0 0 0 4px rgba(211, 47, 47, 0.12);
        }

        button { 
            width: 100%; 
            background: linear-gradient(135deg, #2e7d32 0%, #1b5e20 100%); 
            color: white; 
            padding: 16px; 
            border: none; 
            border-radius: 12px; 
            margin-top: 10px; 
            font-size: 1.05rem; 
            font-weight: 700; 
            cursor: pointer; 
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(46, 125, 50, 0.3);
        }

        button:active { 
            transform: translateY(1px);
            box-shadow: 0 2px 6px rgba(46, 125, 50, 0.2);
        }

        button:disabled { 
            background: #cbd5e1; 
            box-shadow: none;
            cursor: not-allowed;
        }

        .status { 
            margin-bottom: 20px; 
            padding: 14px 16px; 
            border-radius: 12px; 
            text-align: center; 
            font-weight: 600; 
            display: none; 
            font-size: 0.9rem;
            animation: fadeIn 0.3s ease;
        }
        .success { background: #dcfce7; color: #15803d; border: 1px solid #bbf7d0; }
        .error { background: #fee2e2; color: #b91c1c; border: 1px solid #fecaca; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-6px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="card">
    <div class="header">
        <div class="header-icon">🔥</div>
        <h2>LPG Gas Order</h2>
        <div class="subtitle">ग्यास अर्डर फारम</div>
    </div>
    
    <div id="statusBox" class="status"></div>

    <form id="orderForm">
        <div class="form-group">
            <label for="name">Customer Name / नाम</label>
            <input type="text" id="name" required placeholder="Ram Bahadur / राम बहादुर" autocomplete="name">
        </div>

        <div class="form-group">
            <label for="phone">Phone Number / फोन नम्बर</label>
            <input type="tel" id="phone" required placeholder="98XXXXXXXX" pattern="[0-9]{10}" autocomplete="tel">
        </div>

        <div class="form-group">
            <label for="brand">Gas Brand / ब्रान्ड</label>
            <select id="brand">
                <option value="lokpriya Gas">lokpriya Gas / लोकप्रिय ग्यास</option>
                <option value="Manoj Gas">Manoj Gas / मनोज ग्यास</option>

            </select>
        </div>

        <div class="form-group">
            <label for="type">Order Type / प्रकार</label>
            <select id="type">
                <option value="Refill">Refill Only / साट्ने (खाली-हाफ)</option>
                <option value="New Cylinder">New Cylinder / नयाँ सिलिन्डर</option>
            </select>
        </div>

        <div class="form-group">
            <label for="quantity">Quantity / संख्या</label>
            <input type="number" id="quantity" min="1" max="10" value="1" required>
        </div>

        <button type="submit" id="submitBtn">Place Order / अर्डर गर्नुहोस्</button>
    </form>
</div>

<script>
    const GOOGLE_APP_URL = "https://script.google.com/macros/s/AKfycbyWOTGbApokfET-VC_D4qIQjv8joI_syoVpsfxuC_I9kfdV7kCUantvs6NMdeqGmRN5/exec";

    let clientIP = "Unknown";
    fetch('https://api.ipify.org?format=json')
        .then(res => res.json())
        .then(data => clientIP = data.ip)
        .catch(() => clientIP = "Unavailable");

    const form = document.getElementById('orderForm');
    const submitBtn = document.getElementById('submitBtn');
    const statusBox = document.getElementById('statusBox');

    form.addEventListener('submit', async function(e) {
        e.preventDefault();

        const lastSubmit = localStorage.getItem('last_order_time');
        const now = Date.now();
        if (lastSubmit && (now - lastSubmit < 5000)) {
            const waitTime = Math.ceil((5000 - (now - lastSubmit)) / 1000);
            showStatus(`Please wait ${waitTime} seconds before ordering again. / कृपया ${waitTime} सेकेन्ड पर्खनुहोस्।`, 'error');
            return;
        }

        submitBtn.disabled = true;
        submitBtn.innerText = "Processing / अर्डर हुँदैछ...";

        const orderPayload = {
            orderId: "LPG-" + Math.floor(1000 + Math.random() * 9000),
            timestamp: new Date().toLocaleString(),
            ip: clientIP,
            name: document.getElementById('name').value,
            phone: document.getElementById('phone').value,
            brand: document.getElementById('brand').value,
            type: document.getElementById('type').value,
            quantity: document.getElementById('quantity').value
        };

        try {
            await fetch(GOOGLE_APP_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(orderPayload)
            });

            localStorage.setItem('last_order_time', Date.now());
            showStatus("Order Placed Successfully! / अर्डर सफल भयो!", 'success');
            form.reset();
        } catch (err) {
            showStatus("Submission failed. Check connection. / अर्डर असफल भयो।", 'error');
        }

        submitBtn.disabled = false;
        submitBtn.innerText = "Place Order / अर्डर गर्नुहोस्";
    });

    function showStatus(text, type) {
        statusBox.innerText = text;
        statusBox.className = `status ${type}`;
        statusBox.style.display = 'block';
    }
</script>
</body>
</html>
